<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista - Stays</title>
  <link rel="stylesheet" th:href="@{/main.css}">
</head>
<body>

<div th:replace="~{fragments/header :: topbar}"></div>

<main class="page-shell">
  <section class="search-panel">
    <form th:action="@{/results}" method="get" class="search-grid">
      <div class="field-group">
        <label for="location">Location</label>
        <input id="location" name="location" type="text" placeholder="Rome, Center">
      </div>

      <div class="field-group">
        <label for="date">Date</label>
        <input id="date" type="text" value="12-17 Sept.">
      </div>

      <div class="field-group">
        <label for="people">People</label>
        <input id="people" type="text" value="4 adults">
      </div>

      <div class="field-group button-wrap">
        <label>&nbsp;</label>
        <button class="btn btn-primary" type="submit">Search</button>
      </div>
    </form>
  </section>

  <section class="results-layout">
    <aside class="filters">
      <h3>Filters</h3>

      <div class="filter-section">
        <label class="check"><input type="checkbox" checked> Allows pets</label>
        <label class="check"><input type="checkbox" checked> Smoking area</label>
        <label class="check"><input type="checkbox" checked> Breakfast included</label>
      </div>

      <div class="filter-section">
        <h4>Price per night</h4>
        <div class="range-row">
          <span>$0</span>
          <span>$10000</span>
        </div>
        <input type="range" min="0" max="10000" value="1500">
      </div>

      <div class="filter-section">
        <h4>Maximum capacity</h4>
        <div class="range-row">
          <span>1</span>
          <span>30</span>
        </div>
        <input type="range" min="1" max="30" value="8">
      </div>

      <div class="filter-section">
        <h4>Property type</h4>
        <label class="check"><input type="checkbox" checked> Villa</label>
        <label class="check"><input type="checkbox" checked> Hotel room</label>
        <label class="check"><input type="checkbox" checked> Apartment</label>
      </div>

      <div class="filter-section">
        <h4>Facilities</h4>
        <label class="check"><input type="checkbox" checked> Parking space</label>
        <label class="check"><input type="checkbox" checked> Restaurant</label>
        <label class="check"><input type="checkbox" checked> Front desk</label>
      </div>
    </aside>

    <section class="results-content">
      <div class="toolbar">
        <button class="btn btn-primary btn-map" type="button">Show on map</button>

        <div class="sort-group">
          <button class="chip active" type="button">New</button>
          <button class="chip" type="button">Price ascending</button>
          <button class="chip" type="button">Price descending</button>
          <button class="chip" type="button">Rating</button>
        </div>
      </div>

      <div class="property-grid">
        <article class="property-card" th:each="property : ${properties}">
          <a class="fav-btn" href="#">❤</a>

          <img th:src="@{${property.imageUrl}}" alt="Property image">

          <div class="property-body">
            <h3 th:text="${property.name}">Property name</h3>

            <p class="muted-text" th:text="${property.location}">Rome</p>

            <div class="meta-row">
              <span class="rating">
                ★ <span th:text="${property.rating}">4.8</span>
              </span>
            </div>

            <p class="price" th:text="'$' + ${property.pricePerNight}">$200</p>

            <a th:href="@{/details/{id}(id=${property.id})}" class="btn btn-primary btn-small">Details</a>
          </div>
        </article>
      </div>

      <div class="pagination">
        <span class="muted">← Previous</span>
        <span class="page current">1</span>
        <span class="page">2</span>
        <span class="page">3</span>
        <span class="page">…</span>
        <span class="page">5</span>
        <span class="page">Next →</span>
      </div>
    </section>
  </section>
</main>

</body>
</html>
