<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista - Register</title>
  <link rel="stylesheet" th:href="@{/main.css}">
</head>
<body>

<div th:replace="~{fragments/header :: topbar}"></div>

<main class="page-shell">
  <section class="form-layout">
    <div class="form-card" style="max-width: 500px; margin: 0 auto;">
      <h2 style="margin-bottom: 24px;">Create account</h2>

      <form th:action="@{/register}" th:object="${registerForm}" method="post">

        <div class="form-grid" style="display: flex; flex-direction: column; gap: 16px;">
          <div class="field-group">
            <label>First name</label>
            <input type="text" th:field="*{firstName}" placeholder="First name" required>
          </div>

          <div class="field-group">
            <label>Last name</label>
            <input type="text" th:field="*{lastName}" placeholder="Last name" required>
          </div>

          <div class="field-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="Email" required>
          </div>

          <div class="field-group">
            <label>Role</label>
            <select th:field="*{role}" required style="height: 46px; border: 1px solid var(--border); border-radius: 8px; padding: 0 14px; font-family: inherit; font-size: 15px; background: #fff; width: 100%;">
              <option value="">Select role</option>
              <option value="GUEST">Guest</option>
              <option value="HOST">Host</option>
            </select>
          </div>

          <div class="field-group">
            <label>Password</label>
            <input type="password" th:field="*{password}" placeholder="Password" required>
          </div>

          <div class="field-group">
            <label>Confirm password</label>
            <input type="password" th:field="*{confirmPassword}" placeholder="Confirm password" required>
          </div>
        </div>

        <div th:if="${error}" class="error-text" style="margin-top: 16px; color: #d93025; font-size: 14px;" th:text="${error}"></div>

        <button class="btn btn-primary" type="submit" style="margin-top: 24px;">Register</button>
      </form>

      <p class="muted-text" style="margin-top: 32px; font-size: 15px;">
        Already have an account?
        <a th:href="@{/login}" style="color: var(--green-dark); font-weight: 700; text-decoration: underline;">Login here</a>
      </p>
    </div>
  </section>
</main>

</body>
</html>
