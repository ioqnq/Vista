<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista - Register</title>
  <link rel="stylesheet" th:href="@{/main.css}">
</head>
<body>

<div th:replace="~{fragments/header :: topbar}"></div>

<main class="page-shell">
  <section class="form-layout">
    <div class="form-card">
      <h2>Create account</h2>

      <form th:action="@{/register}" th:object="${registerForm}" method="post">
        <div class="form-grid">
          <div class="field-group">
            <label>First name</label>
            <input type="text" th:field="*{firstName}" placeholder="First name" required>
          </div>

          <div class="field-group">
            <label>Last name</label>
            <input type="text" th:field="*{lastName}" placeholder="Last name" required>
          </div>

          <div class="field-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="Email" required>
          </div>

          <div class="field-group">
            <label>Role</label>
            <select th:field="*{role}" required>
              <option value="">Select role</option>
              <option value="GUEST">Guest</option>
              <option value="HOST">Host</option>
            </select>
          </div>

          <div class="field-group">
            <label>Password</label>
            <input type="password" th:field="*{password}" placeholder="Password" required>
          </div>

          <div class="field-group">
            <label>Confirm password</label>
            <input type="password" th:field="*{confirmPassword}" placeholder="Confirm password" required>
          </div>
        </div>

        <div th:if="${error}" class="error-text" th:text="${error}"></div>

        <button class="btn btn-primary full-btn" type="submit">Register</button>
      </form>

      <p class="muted-text" style="margin-top: 16px;">
        Already have an account?
        <a th:href="@{/login}">Login here</a>
      </p>
    </div>
  </section>
</main>

</body>
</html>
