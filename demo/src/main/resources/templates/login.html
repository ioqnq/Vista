<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista - Login</title>
  <link rel="stylesheet" th:href="@{/main.css}">
</head>
<body>

<div th:replace="~{fragments/header :: topbar}"></div>

<main class="page-shell">
  <section class="form-layout">
    <div class="form-card">
      <h2>Login</h2>

      <form th:action="@{/login}" method="post">
        <div class="form-grid">
          <div class="field-group">
            <label>Email</label>
            <input type="email" name="username" placeholder="Enter your email" required>
          </div>

          <div class="field-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>
          </div>
        </div>

        <div th:if="${param.error}" class="error-text">
          Invalid email or password.
        </div>

        <div th:if="${param.logout}" class="success-text">
          You have been logged out.
        </div>

        <button class="btn btn-primary full-btn" type="submit">Login</button>
      </form>

      <p class="muted-text" style="margin-top: 16px;">
        Don’t have an account?
        <a th:href="@{/register}">Register here</a>
      </p>
    </div>
  </section>
</main>

</body>
</html>
