<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista - Host Properties</title>
  <link rel="stylesheet" th:href="@{/main.css}">
</head>
<body>

<div th:replace="~{fragments/header :: topbar}"></div>

<main class="page-shell">
  <section class="list-card">
    <div class="section-head">
      <h2>My properties</h2>
      <button class="btn btn-primary" type="button">Add property</button>
    </div>

    <div class="list-grid">
      <article class="host-card" th:each="property : ${properties}">
        <img th:src="${property.imageUrl}" alt="Property image">

        <div class="host-card-body">
          <h3 th:text="${property.name}">Property name</h3>
          <p th:text="${property.location}">Rome</p>
          <p th:text="'$' + ${property.pricePerNight} + ' / night'">$500/night</p>

          <a th:href="@{/host/properties/{id}(id=${property.id})}" class="btn btn-small btn-primary">View details</a>
        </div>
      </article>
    </div>
  </section>
</main>

</body>
</html>
