<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista - Profile</title>
  <link rel="stylesheet" th:href="@{/main.css}">
</head>
<body>

<div th:replace="~{fragments/header :: topbar}"></div>

<main class="page-shell">
  <section class="list-card">
    <div class="section-head">
      <h2>My profile</h2>
    </div>

    <div style="display: flex; justify-content: flex-start; margin-bottom: 30px;">
      <div style="position: relative;">
        <img th:src="${user?.profileImageUrl != null ? user.profileImageUrl : '/assets/defaultpfp.png'}"
             alt="Profile Avatar"
             style="width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 3px solid var(--green); box-shadow: var(--shadow);">
      </div>
    </div>

    <div class="booking-list" style="display: flex; flex-direction: column; gap: 20px;">

      <div style="display: flex; flex-direction: row; gap: 40px; flex-wrap: wrap; width: 100%;">

        <article class="booking-item" style="width: 160px;">
          <div>
            <h3>First name</h3>
            <p class="muted-text" th:text="${user.firstName}">Corina</p>
          </div>
        </article>

        <article class="booking-item" style="width: 160px;">
          <div>
            <h3>Last name</h3>
            <p class="muted-text" th:text="${user.lastName}">Mihon</p>
          </div>
        </article>

      </div>

      <article class="booking-item">
        <div>
          <h3>Email</h3>
          <p class="muted-text" th:text="${user.email}">corina@example.com</p>
        </div>
      </article>

      <article class="booking-item">
        <div>
          <h3>Role</h3>
          <p class="muted-text" th:text="${user.role}">GUEST</p>
        </div>
      </article>
    </div>

    <div style="margin-top: 30px; display: flex; align-items: center; gap: 12px;">

      <form th:action="@{/logout}" method="post" style="margin: 0;">
        <button class="btn btn-primary" type="submit">Logout</button>
      </form>

      <a th:href="@{/profile/edit}" class="btn btn-primary">
        Edit Profile
      </a>

    </div>
  </section>
</main>

</body>
</html>
