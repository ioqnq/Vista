<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista - Payment</title>
  <link rel="stylesheet" th:href="@{/main.css}">
</head>
<body>

<div th:replace="~{fragments/header :: topbar}"></div>

<main class="page-shell">
  <section class="form-layout">
    <div class="form-card">
      <h2>Payment</h2>

      <div class="payment-options">
        <label class="payment-option">
          <input type="radio" name="paymentMethod" checked>
          <span>Credit card</span>
        </label>

        <label class="payment-option">
          <input type="radio" name="paymentMethod">
          <span>PayPal</span>
        </label>
      </div>

      <div class="form-grid">
        <div class="field-group">
          <label>Card holder name</label>
          <input type="text" placeholder="Corina Popescu">
        </div>

        <div class="field-group">
          <label>Card number</label>
          <input type="text" placeholder="1234 5678 9012 3456">
        </div>

        <div class="field-group">
          <label>Expiry date</label>
          <input type="text" placeholder="MM/YY">
        </div>

        <div class="field-group">
          <label>CVV</label>
          <input type="text" placeholder="123">
        </div>
      </div>

      <a th:href="@{/guest-bookings}" class="btn btn-primary full-btn">Pay now</a>
    </div>

    <aside class="booking-summary-card">
      <h3>Payment summary</h3>

      <div class="summary-row">
        <span>Property</span>
        <span th:text="${property.name}">Authentic Villa Romana</span>
      </div>

      <div class="summary-row">
        <span>Location</span>
        <span th:text="${property.location}">Rome</span>
      </div>

      <div class="summary-row">
        <span>Price per night</span>
        <span th:text="'$' + ${property.pricePerNight}">$500</span>
      </div>

      <div class="summary-row">
        <span>Total</span>
        <strong th:text="'$' + ${total}">$2500</strong>
      </div>
    </aside>
  </section>
</main>

</body>
</html>
